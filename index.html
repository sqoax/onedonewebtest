<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One & Done Picker</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        background: radial-gradient(1200px 600px at 50% 10%, rgba(255,255,255,0.08), transparent 60%),
          #05070b;
        color: rgba(255,255,255,0.9);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 16px;
      }
      .card {
        width: min(820px, 100%);
        background: rgba(10,12,18,0.7);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 22px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.55);
        padding: 28px;
        backdrop-filter: blur(10px);
      }
      h1 {
        margin: 0;
        font-size: 44px;
        letter-spacing: -0.02em;
      }
      .sub {
        margin: 6px 0 22px;
        color: rgba(255,255,255,0.65);
        font-size: 16px;
      }
      label {
        display: block;
        margin: 14px 0 8px;
        color: rgba(255,255,255,0.7);
        font-size: 14px;
      }
      select, input {
        width: 100%;
        box-sizing: border-box;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.10);
        background: rgba(255,255,255,0.04);
        color: rgba(255,255,255,0.92);
        padding: 14px 14px;
        outline: none;
        font-size: 16px;
      }
      select:focus, input:focus {
        border-color: rgba(255,255,255,0.22);
      }
      .btn {
        margin-top: 16px;
        width: 100%;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.10);
        background: rgba(255,255,255,0.06);
        color: rgba(255,255,255,0.92);
        padding: 14px 16px;
        font-size: 16px;
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .status {
        margin-top: 14px;
        color: rgba(255,255,255,0.75);
        font-size: 14px;
      }
      .status .warn { color: #ffd166; }
      .status .ok { color: #7ae582; }

      .divider {
        margin: 22px 0 14px;
        border-top: 1px solid rgba(255,255,255,0.08);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.08);
      }
      th, td {
        padding: 12px 14px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        text-align: left;
      }
      th {
        color: rgba(255,255,255,0.75);
        font-weight: 600;
        background: rgba(255,255,255,0.04);
      }
      tr:last-child td { border-bottom: none; }

      .hidden { display: none; }
      [hidden] { display: none !important; }

      /* Toast */
.toast{
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  background: rgba(15, 18, 28, 0.92);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 14px;
  padding: 12px 14px;
  color: rgba(255,255,255,0.92);
  box-shadow: 0 18px 50px rgba(0,0,0,0.55);
  z-index: 9999;
  max-width: min(520px, calc(100vw - 32px));
  font-size: 14px;
}
.toast.ok { border-color: rgba(122,229,130,0.45); }
.toast.warn { border-color: rgba(255,209,102,0.45); }

    </style>
  </head>
  <body>
    <div class="card">
      <h1>One & Done Picker</h1>
      <div class="sub">Submit your pick, picks auto-reveal Wednesday at 9:00 PM Eastern.</div>

    <form id="pickForm">x
    
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Your name" />
      
      <label for="pick">Pick</label>
      <input id="pick" type="text" placeholder="Your pick" />

      <button id="submitBtn" class="btn" type="submit">Submit pick</button>

      <div id="statusLine" class="status"></div>
    </form>

      <div class="divider"></div>

      <div id="picksBlock" class="hidden">
        <label>Picks</label>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Pick</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="picksRows"></tbody>
        </table>
      </div>
    </div>

    <div class="divider"></div>

<div id="adminBlock" class="hidden">
  <label>Admin</label>
  <button id="adminKeyBtn" class="btn" type="button">Enter admin key</button>
  <button id="resetBtn" class="btn" type="button">Reset picks</button>
  <div id="adminStatus" class="status"></div>
</div>

    <script src="./app.js"></script>

    <div id="toast" class="toast" hidden></div>

  </body>
</html>
