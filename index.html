
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>O&amp;D League</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body data-page="main">
  <div class="app-shell">
    <header class="top-bar" aria-label="App header">
      <div>
        <a class="brand-lockup" href="index.html" aria-label="O&amp;D League home">
          <span class="brand-mark">O&amp;D</span>
          <span>
            <span class="brand-title">One &amp; Done</span>
            <span class="brand-subtitle" id="topContext">Loading league</span>
          </span>
        </a>
      </div>
      <a class="icon-link admin-link" href="admin.html" aria-label="Admin">Admin</a>
    </header>

    <main class="app-main" id="mainContent">
      <div class="loading-state" id="loadingState">
        <div class="loading-pulse"></div>
        <p>Loading league data</p>
      </div>

      <section class="screen active" id="screen-home" aria-labelledby="homeTitle">
        <div class="section-heading">
          <p class="eyebrow">Dashboard</p>
          <h1 id="homeTitle">League Home</h1>
        </div>
        <div id="homeContent"></div>
      </section>

      <section class="screen" id="screen-pick" aria-labelledby="pickTitle">
        <div class="section-heading">
          <p class="eyebrow">Make Pick</p>
          <h1 id="pickTitle">Submit This Week</h1>
        </div>

        <div class="field-block hidden" id="weekSelectorBlock">
          <label for="weekSelector">View week</label>
          <select id="weekSelector"></select>
        </div>

        <div id="pickContent"></div>
      </section>

      <section class="screen" id="screen-board" aria-labelledby="boardTitle">
        <div class="section-heading">
          <p class="eyebrow">Board</p>
          <h1 id="boardTitle">Standings</h1>
        </div>
        <div id="boardContent"></div>
      </section>

      <section class="screen" id="screen-history" aria-labelledby="historyTitle">
        <div class="section-heading">
          <p class="eyebrow">Season Log</p>
          <h1 id="historyTitle">History</h1>
        </div>
        <div class="segmented-control" role="tablist" aria-label="History views">
          <button class="segment active" type="button" data-history-view="tournaments">Tournaments</button>
          <button class="segment" type="button" data-history-view="players">Players</button>
        </div>
        <div id="historyContent"></div>
      </section>

    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" type="button" data-screen="home">
        <span>Home</span>
      </button>
      <button class="nav-item" type="button" data-screen="pick">
        <span>Pick</span>
      </button>
      <button class="nav-item" type="button" data-screen="board">
        <span>Board</span>
      </button>
      <button class="nav-item" type="button" data-screen="history">
        <span>History</span>
      </button>
    </nav>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
